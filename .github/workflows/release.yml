name: Release

# A release is a version tag pushed to the repository, for example v0.1.0.
# The build fails without a lockfile (npm ci), and the release carries an SBOM (FR-23).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two jobs, so that nothing a dependency or a test runs can hold a token that writes.
# "build" installs, tests and makes the SBOM with a token that only reads. "publish"
# holds the token that writes, and runs no code from this repository or its packages:
# it takes the finished SBOM and makes the release.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Adversarial suite
        run: npm run adversarial
      - name: Build the Worker (dry run)
        run: npm run build:worker
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - name: Build the SBOM
        run: npm run sbom
      - name: Supply-chain check
        run: npm run check:supply-chain -- --sbom sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release and attach the SBOM. Nothing else is granted.
      contents: write
    steps:
      # No checkout and no install: this job runs nothing from the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Publish the release with its SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" sbom.cdx.json --title "$TAG" --generate-notes --verify-tag
