name: Advisory check

# FR-23 and Governance (vulnerability intake): once a week, ask npm for known
# flaws in the pinned dependencies. A critical one gets an issue with a 72-hour
# deadline, and this run fails, which notifies the repository owner.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  # Also runs when the check itself changes, so a broken check cannot merge unseen.
  pull_request:
    paths:
      - ".github/workflows/advisories.yml"
      - "scripts/advisory-check.ts"
      - "src/supply-chain/advisories.ts"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To open an issue for a critical advisory. Nothing else is granted.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm audit exits non-zero when it finds anything. The next step decides what
      # that means, and fails if the report is missing or is an error.
      - name: Ask npm for known advisories
        run: npm audit --json > audit.json || true
      - name: Report, and file an issue for each critical advisory
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_ISSUES: ${{ github.event_name != 'pull_request' }}
        run: npx tsx scripts/advisory-check.ts audit.json
